name: Vigilar páginas de entradas

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vigilancia-entradas
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar páginas y enviar avisos
        env:
          SUPABASE_URL: https://yecsgrriuorqjnpldvyo.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMX_EMAIL: ${{ secrets.GMX_EMAIL }}
          GMX_PASSWORD: ${{ secrets.GMX_PASSWORD }}
        run: python monitor.py
